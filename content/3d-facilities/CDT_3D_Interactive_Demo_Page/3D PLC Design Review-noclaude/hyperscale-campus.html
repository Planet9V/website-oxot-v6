<style>
  html,body{margin:0;height:100%}
  three-d-stage:not(:defined){visibility:hidden}
  #link{position:absolute;left:14px;top:14px;z-index:5;font:600 12px Inter,system-ui,sans-serif;
        background:rgba(22,32,59,.92);color:#DCE4F2;padding:8px 12px;border-radius:8px;text-decoration:none}
  #link:hover{background:#16203B;color:#fff}
  #link b{color:#EE7623}

<body>
<three-d-stage name="hyperscale_campus" background="#e8e6e0"></three-d-stage>
<a id="link" href="hyperscale-campus-explorer.html">Open <b>Connection Explorer</b> →</a>
<script src="three-d-stage.js"></script>
<script type="module">
// Geometry lives in campus-model.js, shared with the Connection Explorer.
import { buildCampus } from './campus-model.js';
const stage = document.querySelector('three-d-stage');
const { THREE } = await stage.ready;
const { group, graph } = buildCampus(THREE);
stage.setObject(group);
stage._loop && stage._loop();  // hidden iframes never tick rAF
let n = 0; group.traverse(o => { if (o.isMesh) n++; });
console.log('[campus] meshes', n, '· graph nodes', Object.keys(graph.nodes).length, '· edges', graph.edges.length);
</script>
