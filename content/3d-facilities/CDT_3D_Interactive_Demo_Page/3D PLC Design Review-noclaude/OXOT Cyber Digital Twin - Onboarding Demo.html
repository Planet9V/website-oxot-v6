document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

erif;letter-spacing:.14em;color:#EE7623\">OXOT<\u002Fspan>\n      <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:.13em;text-transform:uppercase;color:#8a8a8d\">Cyber Digital Twin · guided demo<\u002Fspan>\n    <\u002Fdiv>\n    <span style=\"padding:5px 11px;border:1px solid #3a3a3d;border-radius:4px;font:600 9.5px/1 Inter,sans-serif;letter-spacing:.09em;text-transform:uppercase;color:#8a8a8d\">Illustrative example — not a live client model<\u002Fspan>\n  <\u002Fdiv>\n\n  <div style=\"padding:52px 40px 34px;max-width:1180px;margin:0 auto;text-align:center\">\n    <div style=\"font:650 10px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#EE7623;margin-bottom:18px\">Onboarding overview<\u002Fdiv>\n    <h1 style=\"font:800 42px/1.1 Inter,sans-serif;letter-spacing:-.026em;margin:0 0 18px;color:#fff;text-wrap:balance\">See how we onboard a Cyber Digital Twin<\u002Fh1>\n    <p style=\"font:400 15px/1.62 Inter,sans-serif;color:#a8a8a6;margin:0 auto 14px;max-width:44em;text-wrap:pretty\">Four phases, two workshops. To make that concrete we built one example — a hyperscale AI datacentre — and put it on this page so you can move through the process with something real in front of you.<\u002Fp>\n    <p style=\"font:400 13px/1.6 Inter,sans-serif;color:#6a6a6d;margin:0 auto;max-width:44em;text-wrap:pretty\">This is a simplified representation of the method, not the Cyber Digital Twin itself. It shows the shape of the engagement and the kind of question the model answers. Pick a phase below, then follow the prompts in the model beside it.<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 40px 20px;max-width:1560px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:repeat(4,1fr);gap:10px\">\n      <div sc-camel-on-click=\"{{ sel1 }}\" style=\"border:1px solid {{ bd1 }};border-radius:8px;padding:14px 16px;background:{{ bg1 }};cursor:pointer;transition:border-color .14s,background .14s\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n          <span style=\"{{ badge1 }}\">1<\u002Fspan>\n          <span style=\"font:650 8.5px/1 Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#8a8a8d\">Phase<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:700 14px/1.22 Inter,sans-serif;color:#fff\">Build Model<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ sel2 }}\" style=\"border:1px solid {{ bd2 }};border-radius:8px;padding:14px 16px;background:{{ bg2 }};cursor:pointer;transition:border-color .14s,background .14s\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n          <span style=\"{{ badge2 }}\">2<\u002Fspan>\n          <span style=\"font:650 8.5px/1 Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#EE7623\">Workshop<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:700 14px/1.22 Inter,sans-serif;color:#fff\">WS-1 · Initial Risk Assessment<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ sel3 }}\" style=\"border:1px solid {{ bd3 }};border-radius:8px;padding:14px 16px;background:{{ bg3 }};cursor:pointer;transition:border-color .14s,background .14s\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n          <span style=\"{{ badge3 }}\">3<\u002Fspan>\n          <span style=\"font:650 8.5px/1 Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#8a8a8d\">Phase<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:700 14px/1.22 Inter,sans-serif;color:#fff\">Detail Risk Assessment<\u002Fdiv>\n      <\u002Fdiv>\n      <div sc-camel-on-click=\"{{ sel4 }}\" style=\"border:1px solid {{ bd4 }};border-radius:8px;padding:14px 16px;background:{{ bg4 }};cursor:pointer;transition:border-color .14s,background .14s\">\n        <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:8px\">\n          <span style=\"{{ badge4 }}\">4<\u002Fspan>\n          <span style=\"font:650 8.5px/1 Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#EE7623\">Workshop<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"font:700 14px/1.22 Inter,sans-serif;color:#fff\">WS-2 · Risk Alignment<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:0 40px 56px;max-width:1560px;margin:0 auto\">\n    <div style=\"display:grid;grid-template-columns:370px 1fr;gap:16px;align-items:stretch\">\n\n      <div style=\"border:1px solid #232326;border-radius:10px;background:#111113;display:flex;flex-direction:column;overflow:hidden\">\n        <div style=\"padding:18px 20px;border-bottom:1px solid #232326;background:#0f0f10\">\n          <div style=\"font:650 9px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#EE7623;margin-bottom:8px\">{{ phaseKicker }}<\u002Fdiv>\n          <div style=\"font:700 18px/1.2 Inter,sans-serif;letter-spacing:-.012em;color:#fff;margin-bottom:6px\">{{ phaseTitle }}<\u002Fdiv>\n          <div style=\"font:400 11.8px/1.55 Inter,sans-serif;color:#8a8a8d\">{{ phaseLede }}<\u002Fdiv>\n        <\u002Fdiv>\n\n        <div style=\"padding:18px 20px;border-bottom:1px solid #232326\">\n          <div style=\"font:650 9px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6a6a6d;margin-bottom:11px\">In the engagement<\u002Fdiv>\n          <sc-for list=\"{{ phaseWork }}\" as=\"row\" hint-placeholder-count=\"4\">\n            <div style=\"display:flex;gap:9px;font:400 11.8px/1.55 Inter,sans-serif;color:#c8c8c6;margin-bottom:7px\">\n              <span style=\"flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#4a4a4d;margin-top:7px\"><\u002Fspan>\n              <span>{{ row }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:18px 20px;border-bottom:1px solid #232326;background:#0d0d0e\">\n          <div style=\"font:650 9px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#EE7623;margin-bottom:11px\">Try it in the model →<\u002Fdiv>\n          <sc-for list=\"{{ phaseTry }}\" as=\"step\" hint-placeholder-count=\"3\">\n            <div style=\"display:flex;gap:10px;margin-bottom:11px\">\n              <span style=\"flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:4px;border:1px solid #EE7623;color:#EE7623;font:700 9px/1 Inter,sans-serif;margin-top:1px\">{{ step.n }}<\u002Fspan>\n              <div>\n                <div style=\"font:600 11.8px/1.5 Inter,sans-serif;color:#fff;margin-bottom:2px\">{{ step.do }}<\u002Fdiv>\n                <div style=\"font:400 11.2px/1.5 Inter,sans-serif;color:#8a8a8d\">{{ step.see }}<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"padding:18px 20px;margin-top:auto\">\n          <div style=\"font:650 9px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#6a6a6d;margin-bottom:9px\">What comes out of it<\u002Fdiv>\n          <div style=\"display:flex;flex-wrap:wrap;gap:5px\">\n            <sc-for list=\"{{ phaseOut }}\" as=\"tag\" hint-placeholder-count=\"4\">\n              <span style=\"padding:5px 9px;border:1px solid #2c2c2e;border-radius:4px;font:600 10px/1 Inter,sans-serif;color:#c8c8c6\">{{ tag }}<\u002Fspan>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"border:1px solid #232326;border-radius:10px;background:#111113;overflow:hidden;display:flex;flex-direction:column;min-height:620px\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 18px;border-bottom:1px solid #232326;background:#0f0f10\">\n          <div style=\"display:flex;align-items:center;gap:10px\">\n            <span style=\"width:7px;height:7px;border-radius:50%;background:#EE7623\"><\u002Fspan>\n            <span style=\"font:650 10px/1 Inter,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#c8c8c6\">Example model — hyperscale AI datacentre<\u002Fspan>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;gap:14px\">\n            <span style=\"font:400 10.5px/1 Inter,sans-serif;color:#6a6a6d\">Drag to orbit · scroll to zoom · click any component<\u002Fspan>\n            <a href=\"hyperscale-campus-explorer.html\" target=\"_blank\" style=\"font:600 10.5px/1 Inter,sans-serif;color:#EE7623\">Full screen ↗<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <iframe src=\"about:blank#ba2b5e79-8227-4720-aab9-ccae409e8e48\" title=\"Hyperscale campus explorer\" style=\"width:100%;flex:1 1 auto;border:0;display:block;background:#e8e6e0\"><\u002Fiframe>\n        <div style=\"padding:11px 18px;border-top:1px solid #232326;background:#0f0f10;font:400 10.5px/1.5 Inter,sans-serif;color:#6a6a6d\">Open the panel named <strong style=\"color:#a8a8a6;font-weight:650\">{{ phasePanel }}<\u002Fstrong> on the left of the model to follow this phase. The panels mirror the four phases above.<\u002Fdiv>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:56px 40px;border-top:1px solid #1a1a1c;background:#0f0f10\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"display:grid;grid-template-columns:.9fr 1.1fr;gap:52px;align-items:start\">\n        <div>\n          <div style=\"font:650 10px/1 Inter,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#EE7623;margin-bottom:15px\">Why this example<\u002Fdiv>\n          <h2 style=\"font:700 27px/1.16 Inter,sans-serif;letter-spacing:-.02em;margin:0 0 14px;color:#fff\">A hyperscale datacentre, because it is hard<\u002Fh2>\n          <p style=\"font:400 13px/1.66 Inter,sans-serif;color:#a8a8a6;margin:0 0 11px;text-wrap:pretty\">It has everything that makes OT risk difficult in one place: a power train from grid intake to rack tray, liquid cooling with a shared central plant, life-safety systems on hardwired interlocks, and an IT estate sitting right next to all of it.<\u002Fp>\n          <p style=\"font:400 13px/1.66 Inter,sans-serif;color:#a8a8a6;margin:0 0 11px;text-wrap:pretty\">The campus is split into two independent cells, which is how hyperscalers actually build. That gives the demo something worth asking: does a compromise in one cell stay in that cell?<\u002Fp>\n          <p style=\"font:400 13px/1.66 Inter,sans-serif;color:#6a6a6d;margin:0;text-wrap:pretty\">Your facility will look nothing like this. The process is the same.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:10px\">\n          <div style=\"border:1px solid #232326;border-radius:8px;padding:15px;background:#111113\">\n            <div style=\"width:20px;height:3px;border-radius:2px;background:#d8b23a;margin-bottom:10px\"><\u002Fdiv>\n            <div style=\"font:700 11.8px/1.25 Inter,sans-serif;color:#fff;margin-bottom:5px\">Power<\u002Fdiv>\n            <p style=\"font:400 10.6px/1.5 Inter,sans-serif;color:#8a8a8d;margin:0\">Grid intake through MV switchgear, transformers, UPS, generators and per-cell busway to the rack.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #232326;border-radius:8px;padding:15px;background:#111113\">\n            <div style=\"width:20px;height:3px;border-radius:2px;background:#1f6fd0;margin-bottom:10px\"><\u002Fdiv>\n            <div style=\"font:700 11.8px/1.25 Inter,sans-serif;color:#fff;margin-bottom:5px\">Cooling<\u002Fdiv>\n            <p style=\"font:400 10.6px/1.5 Inter,sans-serif;color:#8a8a8d;margin:0\">Central chillers and towers feeding row CDUs, with direct-to-chip loops into each rack.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #232326;border-radius:8px;padding:15px;background:#111113\">\n            <div style=\"width:20px;height:3px;border-radius:2px;background:#2bd0c8;margin-bottom:10px\"><\u002Fdiv>\n            <div style=\"font:700 11.8px/1.25 Inter,sans-serif;color:#fff;margin-bottom:5px\">IT &amp; network<\u002Fdiv>\n            <p style=\"font:400 10.6px/1.5 Inter,sans-serif;color:#8a8a8d;margin:0\">Carrier demarcs, firewalls, dual spine, per-row distribution, jumpbox and out-of-band console.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #232326;border-radius:8px;padding:15px;background:#111113\">\n            <div style=\"width:20px;height:3px;border-radius:2px;background:#a06fd0;margin-bottom:10px\"><\u002Fdiv>\n            <div style=\"font:700 11.8px/1.25 Inter,sans-serif;color:#fff;margin-bottom:5px\">OT boundary<\u002Fdiv>\n            <p style=\"font:400 10.6px/1.5 Inter,sans-serif;color:#8a8a8d;margin:0\">Per-cell OT switch and firewall, data diode, protocol gateway, passive monitoring from the NOC.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #232326;border-radius:8px;padding:15px;background:#111113\">\n            <div style=\"width:20px;height:3px;border-radius:2px;background:#e0483a;margin-bottom:10px\"><\u002Fdiv>\n            <div style=\"font:700 11.8px/1.25 Inter,sans-serif;color:#fff;margin-bottom:5px\">Life safety<\u002Fdiv>\n            <p style=\"font:400 10.6px/1.5 Inter,sans-serif;color:#8a8a8d;margin:0\">Fire panels, aspirating detection, suppression and the hardwired interlocks that bypass the network.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"border:1px solid #232326;border-radius:8px;padding:15px;background:#111113\">\n            <div style=\"width:20px;height:3px;border-radius:2px;background:#8a8a8d;margin-bottom:10px\"><\u002Fdiv>\n            <div style=\"font:700 11.8px/1.25 Inter,sans-serif;color:#fff;margin-bottom:5px\">Physical security<\u002Fdiv>\n            <p style=\"font:400 10.6px/1.5 Inter,sans-serif;color:#8a8a8d;margin:0\">Perimeter detection, mantrap, cameras and door contacts back to the security officer's desk.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:56px 40px;border-top:1px solid #1a1a1c\">\n    <div style=\"max-width:1180px;margin:0 auto\">\n      <div style=\"border:1px solid #2c2c2e;border-left:2px solid #EE7623;border-radius:8px;padding:24px 28px;background:#111113\">\n        <div style=\"font:650 9.5px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#EE7623;margin-bottom:12px\">What this demo is not<\u002Fdiv>\n        <p style=\"font:400 13.5px/1.65 Inter,sans-serif;color:#c8c8c6;margin:0 0 10px;max-width:56em;text-wrap:pretty\">This page is a walkthrough of the onboarding process, running on an example facility we built ourselves. It is deliberately limited — enough interaction to show what the method feels like, and no more.<\u002Fp>\n        <p style=\"font:400 13.5px/1.65 Inter,sans-serif;color:#8a8a8d;margin:0;max-width:56em;text-wrap:pretty\">The Cyber Digital Twin itself carries your live asset data, your configurations, your bills of material and your threat intelligence, and produces the full artifact set. That is a different thing, and we show it separately.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:56px 40px 70px;border-top:1px solid #1a1a1c;background:#0f0f10\">\n    <div style=\"max-width:1180px;margin:0 auto;display:grid;grid-template-columns:1.15fr .85fr;gap:52px;align-items:center\">\n      <div>\n        <h2 style=\"font:700 28px/1.16 Inter,sans-serif;letter-spacing:-.02em;margin:0 0 13px;color:#fff;text-wrap:balance\">Want to see this on your facility?<\u002Fh2>\n        <p style=\"font:400 13.5px/1.62 Inter,sans-serif;color:#a8a8a6;margin:0 0 22px;max-width:42em;text-wrap:pretty\">Your design documents and interface control documents are enough to begin. We build the first model from what you already have, then correct it with your team on the floor.<\u002Fp>\n        <div style=\"display:flex;gap:11px;flex-wrap:wrap\">\n          <a href=\"mailto:info@oxot.nl\" style=\"display:inline-block;padding:12px 21px;border-radius:6px;background:#EE7623;color:#0b0b0c;font:700 12.5px/1 Inter,sans-serif\">info@oxot.nl<\u002Fa>\n          <a href=\"oxot-cdt-process.html\" style=\"display:inline-block;padding:12px 21px;border-radius:6px;border:1px solid #3a3a3d;color:#f2f1ee;font:600 12.5px/1 Inter,sans-serif\">The process, on one page<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #232326;border-radius:9px;padding:20px 22px;background:#111113\">\n        <div style=\"font:650 9px/1 Inter,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:#EE7623;margin-bottom:12px\">To start, we ask for<\u002Fdiv>\n        <div style=\"display:flex;gap:9px;font:400 11.8px/1.55 Inter,sans-serif;color:#c8c8c6;margin-bottom:6px\"><span style=\"flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#EE7623;margin-top:7px\"><\u002Fspan><span>High and detailed level design documents<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:9px;font:400 11.8px/1.55 Inter,sans-serif;color:#c8c8c6;margin-bottom:6px\"><span style=\"flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#EE7623;margin-top:7px\"><\u002Fspan><span>Interface control documents and P&amp;IDs<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:9px;font:400 11.8px/1.55 Inter,sans-serif;color:#c8c8c6;margin-bottom:6px\"><span style=\"flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#EE7623;margin-top:7px\"><\u002Fspan><span>FMEA, hazard log and safety-critical item list<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex;gap:9px;font:400 11.8px/1.55 Inter,sans-serif;color:#c8c8c6\"><span style=\"flex:0 0 auto;width:4px;height:4px;border-radius:50%;background:#EE7623;margin-top:7px\"><\u002Fspan><span>ConOps and minimum operating requirements<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"padding:20px 40px;border-top:1px solid #1a1a1c;display:flex;justify-content:space-between;align-items:baseline;gap:20px\">\n    <span style=\"font:600 10px/1 Inter,sans-serif;letter-spacing:.11em;text-transform:uppercase;color:#4a4a4d\">OXOT · OT security engineering<\u002Fspan>\n    <span style=\"font:400 10px/1 Inter,sans-serif;color:#4a4a4d\">Illustrative example · IEC 62443 · TS 50701 · info@oxot.nl<\u002Fspan>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{}\">\nconst PHASES = [\n  { kicker: 'Phase one · before we meet',\n    title: 'Build Model',\n    lede: 'We turn your design documents into something you can walk through.',\n    panel: '1 · Build Model',\n    work: ['Read the HLD, DLD and interface control documents',\n           'Draw out every asset and every connection between them',\n           'Type each link by service and protocol',\n           'Build the geometry so each component can be selected'],\n    try: [\n      { n: '1', do: 'Open panel 1 and press Fit campus', see: 'The whole site: power yard, chiller plant, data hall, support rooms.' },\n      { n: '2', do: 'Turn on a service — try Electricity, then Cooling', see: 'Only that system lights up. This is how we check a model is complete.' },\n      { n: '3', do: 'Click any cabinet, then open Asset List', see: 'Zone, vendor, protocol and firmware — the register behind the picture.' }\n    ],\n    out: ['Asset list', 'Connection register', 'Navigable model', 'Questions for the floor walk'] },\n\n  { kicker: 'Workshop one · on site, with your team',\n    title: 'WS-1 · Initial Risk Assessment',\n    lede: 'We walk the model, then walk the floor, and correct it to as-is.',\n    panel: '2 · WS-1 Initial Risk Assessment',\n    work: ['Review the model with the people who run the plant',\n           'Walk the floor and fix what the documents got wrong',\n           'Frame the threat using comparative sector data rather than worst case',\n           'Agree initial zones, conduits and SL-T targets'],\n    try: [\n      { n: '1', do: 'Open panel 2 and colour by IEC 62443 Zone', see: 'The site re-reads as zones — IT estate, OT boundary, plant floor.' },\n      { n: '2', do: 'Turn on Conduits', see: 'Every crossing between zones. These are what a workshop argues about.' },\n      { n: '3', do: 'Pick a threat entry point — try the engineering workstation', see: 'What one compromised machine can reach, and where it stops.' }\n    ],\n    out: ['As-is corrected model', 'Asset registry', 'Zones and conduits', 'SL-T per zone'] },\n\n  { kicker: 'Phase three · between the workshops',\n    title: 'Detail Risk Assessment',\n    lede: 'We load your safety and reliability work, then ask what failure costs.',\n    panel: '3 · Detail Risk Assessment',\n    work: ['Attach failure modes from your FMEA and hazard log',\n           'Model how a failure propagates through real dependencies',\n           'Trace attacker pathways and the vulnerabilities they use',\n           'Put a number on the consequence'],\n    try: [\n      { n: '1', do: 'Open panel 3 and run a cascading failure from a row CDU', see: 'The failure spreads wave by wave — cooling, then the racks behind it.' },\n      { n: '2', do: 'Read the consequence figure', see: 'Racks stopped and revenue at risk per hour, from the dependency chain.' },\n      { n: '3', do: 'Fail a busway instead', see: 'It stops at the cell boundary. That is the isolation argument, tested.' }\n    ],\n    out: ['Failure scenarios', 'Threat pathways', 'Consequence in money and hours', 'Assumptions register'] },\n\n  { kicker: 'Workshop two · then delivery',\n    title: 'WS-2 · Risk Alignment',\n    lede: 'We show the consequence, then agree what is reasonable to do about it.',\n    panel: '4 · WS-2 Risk Alignment',\n    work: ['Walk the pathways and where they land',\n           'Review the controls each target level asks for, and why',\n           'Test the gaps against what is reasonably practicable',\n           'Agree the achievable level and the order of work'],\n    try: [\n      { n: '1', do: 'Open panel 4 and view the risk portfolio', see: 'Hazards ranked by consequence, with the cost of each safeguard.' },\n      { n: '2', do: 'Open Assumptions & Provenance', see: 'Where each number came from, and what moves if we got it wrong.' },\n      { n: '3', do: 'Compare two entry points', see: 'Why one control matters more than another — the basis for NOW/NEXT/NEVER.' }\n    ],\n    out: ['ZCR diagram', 'Agreed SL-C', 'NOW / NEXT / NEVER', 'Executive briefing', 'Full report'] }\n];\n\nclass Component extends DCLogic {\n  state = { i: 0 };\n\n  bd(n) { return this.state.i === n ? '#EE7623' : '#232326'; }\n  bg(n) { return this.state.i === n ? '#17120e' : '#111113'; }\n  badge(n) {\n    const on = this.state.i === n;\n    return 'display:inline-flex;align-items:center;justify-content:center;width:19px;height:19px;border-radius:5px;'\n      + 'background:' + (on ? '#EE7623' : '#232326') + ';color:' + (on ? '#0b0b0c' : '#8a8a8d')\n      + ';font:800 9.5px/1 Inter,sans-serif;flex:0 0 auto';\n  }\n\n  renderVals() {\n    const p = PHASES[this.state.i] || PHASES[0];\n    const pick = n => () => this.setState({ i: n });\n    return {\n      sel1: pick(0), sel2: pick(1), sel3: pick(2), sel4: pick(3),\n      bd1: this.bd(0), bd2: this.bd(1), bd3: this.bd(2), bd4: this.bd(3),\n      bg1: this.bg(0), bg2: this.bg(1), bg3: this.bg(2), bg4: this.bg(3),\n      badge1: this.badge(0), badge2: this.badge(1), badge3: this.badge(2), badge4: this.badge(3),\n      phaseTitle: p.title, phaseLede: p.lede, phaseKicker: p.kicker, phasePanel: p.panel,\n      phaseWork: p.work, phaseTry: p.try, phaseOut: p.out\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
